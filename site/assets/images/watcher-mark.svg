<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27 -27 54 57" role="img" aria-label="WAtcher emblem">
  <!-- Icon variant of the WAtcher emblem (ported from the paper's TikZ \WAmark, comp/logo_defs.tex):
       a stopwatch whose bezel has a cyan look-ahead window, an eye in the dial, and a safety shield. -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
    <circle r="20.2"/>
    <rect x="-3.6" y="-24" width="7.2" height="3" rx="0.9"/>
    <rect x="-2.3" y="-23" width="4.6" height="2" rx="0.7" transform="rotate(-45)"/>
  </g>
  <rect x="-1.6" y="-21.8" width="3.2" height="2.8" fill="#2C3E50"/>
  <rect x="-3.6" y="-24" width="7.2" height="3" rx="0.9" fill="#2C3E50"/>
  <g transform="rotate(-45)" fill="#2C3E50">
    <rect x="-1.2" y="-21.4" width="2.4" height="2.4"/>
    <rect x="-2.3" y="-23" width="4.6" height="2" rx="0.7"/>
  </g>
  <circle r="18.1" fill="none" stroke="#2C3E50" stroke-width="4.2"/>
  <path d="M0 -15.9 L0 -20.2 A20.2 20.2 0 0 1 20.089 -2.111 L18.081 1.582 L15.813 -1.662 A15.9 15.9 0 0 0 0 -15.9 Z" fill="#88C0D0"/>
  <circle r="15.6" fill="#ffffff"/>
  <clipPath id="wm-eye"><path d="M-14 0 C-6.6 -11.9 6.6 -11.9 14 0 C6.6 9.6 -6.6 9.6 -14 0 Z"/></clipPath>
  <path d="M-14 0 C-6.6 -11.9 6.6 -11.9 14 0 C6.6 9.6 -6.6 9.6 -14 0 Z" fill="#ffffff"/>
  <g clip-path="url(#wm-eye)">
    <circle r="8.9" fill="#527297"/>
    <circle r="3.2" fill="#2C3E50"/>
    <circle cx="-3" cy="-3.1" r="1.7" fill="#ffffff"/>
  </g>
  <path d="M-14 0 C-6.6 -11.9 6.6 -11.9 14 0 C6.6 9.6 -6.6 9.6 -14 0 Z" fill="none" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M-14 0 C-6.6 -11.9 6.6 -11.9 14 0" fill="none" stroke="#2C3E50" stroke-width="2.3" stroke-linecap="round"/>
  <g transform="translate(0 19.3) scale(1.08)">
    <path d="M-5.85 -5.35 L5.85 -5.35 L5.85 -0.5 C5.85 4.15 3.15 6.15 0 7.725 C-3.15 6.15 -5.85 4.15 -5.85 -0.5 Z" fill="#ffffff"/>
    <path d="M-4.6 -4.1 L4.6 -4.1 L4.6 -0.5 C4.6 2.9 2.4 4.9 0 6.1 C-2.4 4.9 -4.6 2.9 -4.6 -0.5 Z" fill="#456B6F"/>
  </g>
</svg>
